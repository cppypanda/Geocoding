<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器内部错误 - 陆梧GeoCo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <div class="card shadow-sm border-0 mx-auto" style="max-width: 620px;">
            <div class="card-body p-5 text-center">
                <h1 class="display-5 mb-3">系统暂时遇到问题</h1>
                <p class="text-muted">错误已自动提交给管理员，请稍后重试。</p>
                {% if error_reference %}
                    <p class="small text-muted">错误编号：<code>{{ error_reference }}</code></p>
                {% endif %}
                <a class="btn btn-primary mt-2" href="{{ url_for('main.index') }}">返回首页</a>
            </div>
        </div>
    </main>
</body>
</html>
